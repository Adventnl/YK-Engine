# Builds and tests the engine on the systems a game ships to. The Linux job repeats what
# scripts/verify.sh does locally; the Windows (MSVC) and macOS (Apple clang) jobs are the checks
# that could not be run where the engine was developed (docs/STATUS.md, "Not verified").
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev
      - name: Configure
        run: cmake --preset dev
      - name: Formatting
        run: cmake --build --preset dev --target format-check
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Visual Studio, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
