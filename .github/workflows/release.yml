name: Release installers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Assign a unique version to this push
        id: version
        run: |
          base=$(sed -n 's/^set(YK_RELEASE_VERSION "\([0-9.]*\)".*/\1/p' CMakeLists.txt)
          test -n "$base"
          IFS=. read -r major minor patch <<< "$base"
          echo "version=$major.$minor.$((patch + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check updater syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'packaging/update/windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          & tests/update/windows-mock.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater mock test failed' }
      - name: Install NSIS on the build runner
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'NSIS was not installed' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure with a static C++ runtime
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DYK_RELEASE_VERSION=${{ env.RELEASE_VERSION }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build Windows setup wizard
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -G NSIS -B build/windows-dist
          if ($LASTEXITCODE -ne 0) { throw 'CPack NSIS failed' }
          $installer = Get-ChildItem build/windows-dist/YKEngine-*-windows-x64.exe
          if (@($installer).Count -ne 1) { throw 'Expected one Windows installer' }
          $installPath = Join-Path $env:RUNNER_TEMP 'YKEngineInstallerSmoke'
          & $installer.FullName /S "/D=$installPath"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer failed' }
          Start-Sleep -Seconds 5
          $installRoots = @($installPath, (Join-Path $env:ProgramFiles 'YK Engine'),
            (Join-Path ${env:ProgramFiles(x86)} 'YK Engine'))
          $actualRoot = $installRoots | Where-Object {
            Test-Path (Join-Path $_ 'bin/yk_editor.exe')
          } | Select-Object -First 1
          if (!$actualRoot) {
            foreach ($root in $installRoots) {
              if (Test-Path $root) { Get-ChildItem $root -Recurse | Select-Object -First 40 FullName }
            }
            throw 'Windows installer did not create the editor in an expected location'
          }
          foreach ($name in 'yk_editor.exe', 'yk_player.exe', 'yk.exe') {
            if (!(Test-Path (Join-Path $actualRoot "bin/$name"))) { throw "Installer omitted $name" }
          }
          & (Join-Path $actualRoot 'bin/yk.exe') validate (Join-Path $actualRoot 'share/yk-engine/YK-DemoGame')
          if ($LASTEXITCODE -ne 0) { throw 'The installed engine cannot validate its sample' }
          $newGame = Join-Path $actualRoot 'share/yk-engine/Fireboy-Watergirl-Demo'
          if (!(Test-Path (Join-Path $newGame 'project.ykproj'))) { throw 'Installer omitted Fireboy and Watergirl' }
          & (Join-Path $actualRoot 'bin/yk.exe') validate $newGame
          if ($LASTEXITCODE -ne 0) { throw 'The installed engine cannot validate Fireboy and Watergirl' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows-dist/YKEngine-*-windows-x64.exe
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-14
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check updater syntax
        run: bash -n packaging/update/macos.sh
      - name: Install Ninja on the build runner
        run: brew install ninja
      - name: Configure
        run: cmake --preset release -DYK_WARNINGS_AS_ERRORS=OFF -DYK_RELEASE_VERSION="$RELEASE_VERSION"
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Build macOS installers
        run: scripts/package-macos.sh --no-build
      - name: Verify the packaged application and installers
        run: scripts/verify-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            build/macos-dist/*.dmg
            build/macos-dist/*.pkg
          if-no-files-found: error

  publish:
    needs: [prepare, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer*'
          path: installers
          merge-multiple: true
      - name: Publish only after both platform checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find installers -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find installers -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find installers -maxdepth 1 -name '*.pkg' | wc -l)" -eq 1
          (cd installers && sha256sum *.exe *.dmg *.pkg > SHA256SUMS.txt)
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "YK Engine $RELEASE_VERSION" \
              --generate-notes --draft
          fi
          gh release edit "$tag" --draft=false --latest
